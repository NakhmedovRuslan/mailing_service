{% extends 'base.html' %}
{% block title %}Главная страница{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h1 class="page-title mb-1">Главная</h1>
        <p class="text-muted mb-0">
            Управление рассылками и получателями
        </p>
    </div>
</div>

<div class="row g-4 mb-4">
    <div class="col-xl-4 col-md-6">
        <div class="card stat-card shadow-sm h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-2">
                            Все рассылки
                        </p>
                        <h2 class="fw-bold mb-0">{{ total_mailings }}</h2>
                    </div>
                    <div class="stat-icon text-primary">
                        <i class="bi bi-send"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-xl-4 col-md-6">
        <div class="card stat-card shadow-sm h-100">
            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <div>
                        <p class="text-muted mb-2">
                            Активные рассылки
                        </p>

                        <h2 class="fw-bold mb-0">{{ active_mailings }}</h2>
                    </div>

                    <div class="stat-icon text-success">
                        <i class="bi bi-activity"></i>
                    </div>

                </div>

            </div>
        </div>
    </div>


    <div class="col-xl-4 col-md-6">
        <div class="card stat-card shadow-sm h-100">
            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <div>
                        <p class="text-muted mb-2">
                            Уникальные получатели
                        </p>

                        <h2 class="fw-bold mb-0">{{ total_recipients }}</h2>
                    </div>

                    <div class="stat-icon text-info">
                        <i class="bi bi-people"></i>
                    </div>

                </div>

            </div>
        </div>
    </div>

</div>
{% endblock %}
