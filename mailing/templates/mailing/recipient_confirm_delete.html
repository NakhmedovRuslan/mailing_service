{% extends 'base.html' %}

{% block title %}Удаление получателя{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom">
                    <h4 class="mb-0 text-danger">Удаление получателя</h4>
                </div>

                <div class="card-body">

                    <p class="mb-4">
                        Вы уверены, что хотите удалить получателя
                        <strong>{{ object.full_name }}</strong>
                        (<a href="mailto:{{ object.email }}">{{ object.email }}</a>)?
                    </p>

                    <div class="alert alert-danger mb-4">
                        Действие нельзя отменить!
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{% url 'mailing:recipient_list' %}" class="btn btn-outline-secondary">
                                Отмена
                            </a>

                            <button type="submit" class="btn btn-danger px-4">
                                Удалить
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
