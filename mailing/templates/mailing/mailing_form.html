{% extends 'base.html' %}

{% block title %}Создание рассылки{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="alert alert-light border mb-4">
                Нет подходящего сообщения или получателя?
                <a href="{% url 'mailing:message_create' %}" target="_blank">Создать сообщение</a>
                или
                <a href="{% url 'mailing:recipient_create' %}" target="_blank">Создать получателя</a>
            </div>
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom">
                    <h4 class="mb-0">Новая рассылка</h4>
                </div>

                <div class="card-body">

                    <form method="post">
                        {% csrf_token %}
                        {{ form.non_field_errors }}
                        {{ form.as_p }}

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{% url 'mailing:mailing_list' %}" class="btn btn-outline-secondary">
                                Отмена
                            </a>

                            <button type="submit" class="btn btn-primary px-4">
                                Создать рассылку
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
